<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 530" role="img" aria-labelledby="title desc">
<title id="title">Emulation versus virtualization</title><desc id="desc">Two separate panels ask whether a target machine model is simulated or whether resources are presented through a virtualization boundary.</desc>
<style>.bg{fill:#f8fafc}.h{font:700 20px sans-serif;fill:#0f172a}.k{font:700 16px sans-serif;fill:#0f172a}.t{font:13px sans-serif;fill:#334155}.e{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:12}.v{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.q{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:8}.line{stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#475569"/></marker></defs><rect class="bg" width="390" height="530"/>
<text class="h" x="195" y="32" text-anchor="middle">Emulation ≠ virtualization</text><text class="t" x="195" y="54" text-anchor="middle">COURSE CONCEPT: start with the question</text>
<rect class="e" x="24" y="84" width="342" height="172"/><text class="k" x="195" y="115" text-anchor="middle">Emulation</text><rect class="q" x="46" y="136" width="298" height="45"/><text class="t" x="195" y="164" text-anchor="middle">Which target machine/environment is modeled?</text><line class="line" x1="195" y1="182" x2="195" y2="209"/><rect class="q" x="46" y="211" width="298" height="30"/><text class="t" x="195" y="232" text-anchor="middle">How is that model executed or translated?</text>
<rect class="v" x="24" y="280" width="342" height="172"/><text class="k" x="195" y="311" text-anchor="middle">Virtualization</text><rect class="q" x="46" y="332" width="298" height="45"/><text class="t" x="195" y="360" text-anchor="middle">Which resource/interface is presented?</text><line class="line" x1="195" y1="378" x2="195" y2="405"/><rect class="q" x="46" y="407" width="298" height="30"/><text class="t" x="195" y="428" text-anchor="middle">What boundary maps guest state to host resource?</text>
<text class="t" x="195" y="489" text-anchor="middle">Product names alone do not prove a specific mode.</text></svg>