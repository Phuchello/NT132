<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 650" role="img" aria-labelledby="title desc"><title id="title">Virtualization enables but does not equal cloud</title><desc id="desc">A flow starts with physical resources and virtualization, then shows cloud delivery needs additional on-demand, pooled, elastic, and measured characteristics.</desc><style>.bg{fill:#f8fafc}.h{font:700 20px sans-serif;fill:#0f172a}.k{font:700 15px sans-serif;fill:#0f172a}.t{font:13px sans-serif;fill:#334155}.p{fill:#e2e8f0;stroke:#475569;stroke-width:2;rx:12}.v{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.c{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:12}.need{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}.arrow{stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#475569"/></marker></defs><rect class="bg" width="390" height="650"/><text class="h" x="195" y="32" text-anchor="middle">Virtualization ≠ cloud</text><text class="t" x="195" y="54" text-anchor="middle">SUPPLEMENTARY CLOUD CONTEXT: NIST boundary</text><rect class="p" x="35" y="85" width="320" height="62"/><text class="k" x="195" y="113" text-anchor="middle">Physical resources</text><text class="t" x="195" y="135" text-anchor="middle">compute · storage · network</text><line class="arrow" x1="195" y1="148" x2="195" y2="181"/><rect class="v" x="35" y="183" width="320" height="72"/><text class="k" x="195" y="213" text-anchor="middle">Virtualization</text><text class="t" x="195" y="237" text-anchor="middle">abstraction + virtualized instances</text><text class="t" x="195" y="292" text-anchor="middle">Not sufficient to call it cloud.</text><rect class="need" x="35" y="315" width="320" height="150"/><text class="k" x="195" y="345" text-anchor="middle">Additional delivery evidence</text><text class="t" x="195" y="375" text-anchor="middle">on-demand self-service · broad network access</text><text class="t" x="195" y="402" text-anchor="middle">resource pooling · rapid elasticity</text><text class="t" x="195" y="429" text-anchor="middle">measured service</text><line class="arrow" x1="195" y1="466" x2="195" y2="499"/><rect class="c" x="35" y="501" width="320" height="74"/><text class="k" x="195" y="531" text-anchor="middle">Cloud service delivery</text><text class="t" x="195" y="554" text-anchor="middle">only after characteristics are evidenced</text><text class="t" x="195" y="620" text-anchor="middle">Virtualization is commonly an enabling technology.</text></svg>