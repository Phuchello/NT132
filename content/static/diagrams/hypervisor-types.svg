<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 660" role="img" aria-labelledby="title desc"><title id="title">Type 1 and Type 2 hypervisor placement</title><desc id="desc">Two stacked course diagrams distinguish a Type 1 VMM directly on hardware from a Type 2 VMM on a host operating system.</desc><style>.bg{fill:#f8fafc}.h{font:700 20px sans-serif;fill:#0f172a}.k{font:700 15px sans-serif;fill:#0f172a}.t{font:13px sans-serif;fill:#334155}.g{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:8}.v{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:8}.o{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:8}.p{fill:#e2e8f0;stroke:#475569;stroke-width:2;rx:8}</style><rect class="bg" width="390" height="660"/><text class="h" x="195" y="32" text-anchor="middle">Hypervisor placement</text><text class="t" x="195" y="54" text-anchor="middle">COURSE CONCEPT: Type 1 versus Type 2</text><text class="k" x="195" y="91" text-anchor="middle">Type 1 / Bare-metal</text><rect class="g" x="35" y="110" width="140" height="45"/><rect class="g" x="215" y="110" width="140" height="45"/><text class="t" x="105" y="138" text-anchor="middle">Guest A</text><text class="t" x="285" y="138" text-anchor="middle">Guest B</text><rect class="v" x="35" y="170" width="320" height="45"/><text class="t" x="195" y="198" text-anchor="middle">VMM directly on hardware</text><rect class="p" x="35" y="230" width="320" height="45"/><text class="t" x="195" y="258" text-anchor="middle">Hardware</text><text class="k" x="195" y="330" text-anchor="middle">Type 2 / Hosted</text><rect class="g" x="35" y="350" width="140" height="45"/><rect class="g" x="215" y="350" width="140" height="45"/><text class="t" x="105" y="378" text-anchor="middle">Guest A</text><text class="t" x="285" y="378" text-anchor="middle">Guest B</text><rect class="v" x="35" y="410" width="320" height="45"/><text class="t" x="195" y="438" text-anchor="middle">VMM on host operating system</text><rect class="o" x="35" y="470" width="320" height="45"/><text class="t" x="195" y="498" text-anchor="middle">Host operating system</text><rect class="p" x="35" y="530" width="320" height="45"/><text class="t" x="195" y="558" text-anchor="middle">Hardware</text><text class="t" x="195" y="620" text-anchor="middle">Placement alone does not prove outcome or cloud status.</text></svg>