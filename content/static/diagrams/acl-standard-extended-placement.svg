<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" role="img" aria-labelledby="title desc">
  <title id="title">Standard and extended ACL placement heuristics</title>
  <desc id="desc">A topology shows the usual placement heuristics: standard ACL near the destination and extended ACL near the source, not absolute rules.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs>
  <style>
    .bg{fill:#f8fafc}.title{font:700 19px sans-serif;fill:#0f172a}.sub{font:13px sans-serif;fill:#475569}
    .box{fill:#fff;stroke:#2563eb;stroke-width:2;rx:12}.hint{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:10}.h{font:700 14px sans-serif;fill:#0f172a}
    .t{font:12px sans-serif;fill:#334155}.small{font:11px sans-serif;fill:#64748b}.arr{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <rect class="bg" width="390" height="520"/>
  <text class="title" x="195" y="31" text-anchor="middle">ACL placement</text>
  <text class="sub" x="195" y="52" text-anchor="middle">heuristic theo độ cụ thể của rule</text>
  <rect class="box" x="20" y="104" width="95" height="64"/><text class="h" x="67" y="131" text-anchor="middle">Source</text><text class="t" x="67" y="151" text-anchor="middle">PC-A</text>
  <rect class="box" x="147" y="104" width="95" height="64"/><text class="h" x="195" y="131" text-anchor="middle">Router</text><text class="t" x="195" y="151" text-anchor="middle">interfaces</text>
  <rect class="box" x="275" y="104" width="95" height="64"/><text class="h" x="322" y="131" text-anchor="middle">Destination</text><text class="t" x="322" y="151" text-anchor="middle">server</text>
  <line class="arr" x1="119" y1="136" x2="143" y2="136"/><line class="arr" x1="246" y1="136" x2="271" y2="136"/>
  <rect class="hint" x="30" y="225" width="330" height="82"/><text class="h" x="195" y="253" text-anchor="middle">Extended ACL → thường gần source</text><text class="t" x="195" y="276" text-anchor="middle">lọc source, destination, protocol, port cụ thể</text><text class="small" x="195" y="296" text-anchor="middle">loại traffic không mong muốn sớm hơn</text>
  <rect class="hint" x="30" y="337" width="330" height="82"/><text class="h" x="195" y="365" text-anchor="middle">Standard ACL → thường gần destination</text><text class="t" x="195" y="388" text-anchor="middle">chủ yếu biết source nên tránh chặn quá rộng</text><text class="small" x="195" y="408" text-anchor="middle">vị trí cuối cùng vẫn theo policy và topology</text>
  <text class="t" x="195" y="468" text-anchor="middle">Heuristic, không phải luật tuyệt đối.</text>
</svg>
