<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" role="img" aria-labelledby="title desc">
  <title id="title">SSH host-key trust phases</title>
  <desc id="desc">The first SSH connection verifies a server fingerprint and records the host key; later connections compare the presented key with known_hosts.</desc>
  <style>
    .bg{fill:#f8fafc}.title{font:700 21px sans-serif;fill:#0f172a}.sub{font:12px sans-serif;fill:#475569}
    .first{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}.later{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:10}.stop{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:10}
    .h{font:700 15px sans-serif;fill:#0f172a}.t{font:12px sans-serif;fill:#334155}.line{stroke:#475569;stroke-width:2.5}
  </style>
  <rect class="bg" width="390" height="520"/>
  <rect class="first" x="18" y="70" width="168" height="40"/><rect class="later" x="204" y="70" width="168" height="40"/>
  <text class="h" x="102" y="95" text-anchor="middle">FIRST CONNECTION</text><text class="h" x="288" y="95" text-anchor="middle">LATER CONNECTION</text>
  <line class="line" x1="102" y1="150" x2="102" y2="160"/><line class="line" x1="102" y1="205" x2="102" y2="215"/><line class="line" x1="102" y1="260" x2="102" y2="270"/>
  <line class="line" x1="288" y1="150" x2="288" y2="160"/><line class="line" x1="288" y1="205" x2="288" y2="215"/><line class="line" x1="288" y1="260" x2="288" y2="270"/>
  <rect class="first" x="28" y="115" width="148" height="35"/><rect class="first" x="28" y="170" width="148" height="35"/><rect class="first" x="28" y="225" width="148" height="35"/><rect class="first" x="28" y="280" width="148" height="35"/>
  <rect class="later" x="214" y="115" width="148" height="35"/><rect class="later" x="214" y="170" width="148" height="35"/><rect class="later" x="214" y="225" width="148" height="35"/><rect class="stop" x="214" y="280" width="148" height="35"/>
  <text class="t" x="102" y="137" text-anchor="middle">server host key</text><text class="t" x="102" y="192" text-anchor="middle">verify fingerprint</text><text class="t" x="102" y="247" text-anchor="middle">record known_hosts</text><text class="t" x="102" y="302" text-anchor="middle">continue authentication</text>
  <text class="t" x="288" y="137" text-anchor="middle">presented host key</text><text class="t" x="288" y="192" text-anchor="middle">compare known_hosts</text><text class="t" x="288" y="247" text-anchor="middle">match: continue</text><text class="t" x="288" y="302" text-anchor="middle">mismatch: investigate</text>
  <rect class="later" x="30" y="365" width="330" height="75"/><text class="h" x="195" y="391" text-anchor="middle">Trust is evidence, not a shortcut</text><text class="t" x="195" y="414" text-anchor="middle">A rebuild may be legitimate; a wrong host or</text><text class="t" x="195" y="431" text-anchor="middle">interception is also possible. Verify first.</text>
  <text class="title" x="195" y="29" text-anchor="middle">SSH host-key trust</text>
  <text class="sub" x="195" y="50" text-anchor="middle">algorithm-neutral fingerprint mental model</text>
</svg>
