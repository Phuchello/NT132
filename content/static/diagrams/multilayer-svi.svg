<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 680" width="100%" height="100%">
  <rect width="390" height="680" rx="14" fill="#ffffff"/>
  <rect x="14" y="14" width="362" height="42" rx="8" fill="#059669"/>
  <text x="195" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MULTILAYER SWITCH + SVI</text>
  <text x="195" y="82" fill="#475569" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">L2 access, L3 gateway logic trong cùng thiết bị</text>

  <rect x="20" y="108" width="150" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="135" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PC-A</text>
  <text x="95" y="158" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">VLAN 10</text>
  <text x="95" y="177" fill="#475569" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">192.168.10.10</text>
  <rect x="220" y="108" width="150" height="78" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="295" y="135" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PC-B</text>
  <text x="295" y="158" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">VLAN 20</text>
  <text x="295" y="177" fill="#475569" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">192.168.20.10</text>

  <line x1="95" y1="186" x2="95" y2="240" stroke="#2563eb" stroke-width="3"/>
  <polygon points="95,252 88,238 102,238" fill="#2563eb"/>
  <line x1="295" y1="186" x2="295" y2="240" stroke="#dc2626" stroke-width="3"/>
  <polygon points="295,252 288,238 302,238" fill="#dc2626"/>
  <rect x="39" y="256" width="112" height="66" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="95" y="284" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">S1</text>
  <text x="95" y="305" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">access ports</text>
  <rect x="239" y="256" width="112" height="66" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="295" y="284" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">S2</text>
  <text x="295" y="305" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">access ports</text>

  <line x1="151" y1="289" x2="177" y2="289" stroke="#059669" stroke-width="4"/>
  <line x1="213" y1="289" x2="239" y2="289" stroke="#059669" stroke-width="4"/>
  <rect x="173" y="250" width="44" height="78" rx="9" fill="#059669"/>
  <text x="195" y="277" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">MLS</text>
  <text x="195" y="298" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">L2 + L3</text>
  <text x="195" y="350" fill="#047857" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">TRUNK uplink</text>

  <rect x="22" y="382" width="346" height="116" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="38" y="410" fill="#047857" font-family="system-ui, sans-serif" font-size="14" font-weight="700">SVI = cổng Layer 3 logic</text>
  <text x="38" y="438" fill="#0f172a" font-family="ui-monospace, monospace" font-size="13">interface vlan 10  →  192.168.10.1/24</text>
  <text x="38" y="464" fill="#0f172a" font-family="ui-monospace, monospace" font-size="13">interface vlan 20  →  192.168.20.1/24</text>
  <text x="38" y="486" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5">MLS định tuyến giữa các SVI sau khi bật IP routing.</text>

  <rect x="22" y="518" width="346" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="546" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Trace khác VLAN</text>
  <text x="38" y="572" fill="#475569" font-family="ui-monospace, monospace" font-size="12">PC-A → SVI VLAN 10 → SVI VLAN 20 → PC-B</text>
  <text x="38" y="594" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5">Frame được đóng gói lại ở ranh giới Layer 3.</text>
  <text x="195" y="646" fill="#059669" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">SVI không phải là một cổng dây vật lý riêng.</text>
</svg>
