<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 430" role="img" aria-labelledby="title desc">
  <title id="title">Server platform map</title>
  <desc id="desc">One service requirement branches independently to Windows Server, Linux Server, or a cloud platform.</desc>
  <style>
    .bg{fill:#f8fafc}.title{font:700 22px sans-serif;fill:#0f172a}.sub{font:13px sans-serif;fill:#475569}
    .box{fill:#fff;stroke:#2563eb;stroke-width:2;rx:12}.platform{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:12}
    .h{font:700 15px sans-serif;fill:#0f172a}.t{font:12px sans-serif;fill:#334155}.small{font:11px sans-serif;fill:#64748b}
    .line{stroke:#2563eb;stroke-width:3;fill:none}
  </style>
  <rect class="bg" width="390" height="430"/>
  <!-- Connectors are behind the nodes: one independent branch per platform. -->
  <line class="line" x1="195" y1="148" x2="195" y2="182"/>
  <line class="line" x1="72" y1="182" x2="318" y2="182"/>
  <line class="line" x1="72" y1="182" x2="72" y2="220"/>
  <line class="line" x1="195" y1="182" x2="195" y2="220"/>
  <line class="line" x1="318" y1="182" x2="318" y2="220"/>
  <rect class="box" x="30" y="78" width="330" height="70"/>
  <rect class="platform" x="14" y="220" width="116" height="92"/>
  <rect class="platform" x="137" y="220" width="116" height="92"/>
  <rect class="platform" x="260" y="220" width="116" height="92"/>
  <rect class="box" x="40" y="344" width="310" height="54"/>
  <text class="title" x="195" y="34" text-anchor="middle">Service → platform</text>
  <text class="sub" x="195" y="56" text-anchor="middle">một mục tiêu, nhiều boundary vận hành</text>
  <text class="h" x="195" y="108" text-anchor="middle">Service requirement</text>
  <text class="t" x="195" y="131" text-anchor="middle">DNS · web · file · identity · monitoring</text>
  <text class="h" x="72" y="251" text-anchor="middle">Windows</text>
  <text class="h" x="72" y="272" text-anchor="middle">Server</text>
  <text class="small" x="72" y="294" text-anchor="middle">role · process · policy</text>
  <text class="h" x="195" y="251" text-anchor="middle">Linux</text>
  <text class="h" x="195" y="272" text-anchor="middle">Server</text>
  <text class="small" x="195" y="294" text-anchor="middle">daemon · package · access</text>
  <text class="h" x="318" y="251" text-anchor="middle">Cloud</text>
  <text class="h" x="318" y="272" text-anchor="middle">platform</text>
  <text class="small" x="318" y="294" text-anchor="middle">VM or managed app</text>
  <text class="h" x="195" y="368" text-anchor="middle">One service goal, three independent</text>
  <text class="h" x="195" y="387" text-anchor="middle">platform choices</text>
</svg>
