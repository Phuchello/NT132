<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 640" role="img" aria-labelledby="title desc">
  <title id="title">Virtualization abstraction levels</title><desc id="desc">A mobile-first stack shows library API, OS ABI, machine ISA, system environment, and physical resources.</desc>
  <style>.bg{fill:#f8fafc}.h{font:700 20px sans-serif;fill:#0f172a}.k{font:700 15px sans-serif;fill:#0f172a}.t{font:13px sans-serif;fill:#334155}.card{stroke-width:2;rx:12}.api{fill:#f3e8ff;stroke:#9333ea}.abi{fill:#dbeafe;stroke:#2563eb}.isa{fill:#dcfce7;stroke:#16a34a}.sys{fill:#fef3c7;stroke:#d97706}.phy{fill:#e2e8f0;stroke:#475569}.arrow{stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#475569"/></marker></defs><rect class="bg" width="390" height="640"/>
  <text class="h" x="195" y="32" text-anchor="middle">Abstraction levels</text><text class="t" x="195" y="53" text-anchor="middle">COURSE CONCEPT: interface changes by level</text>
  <rect class="card api" x="30" y="80" width="330" height="72"/><text class="k" x="195" y="108" text-anchor="middle">Library-level abstraction</text><text class="t" x="195" y="132" text-anchor="middle">API seen by an application</text>
  <line class="arrow" x1="195" y1="152" x2="195" y2="178"/><rect class="card abi" x="30" y="180" width="330" height="72"/><text class="k" x="195" y="208" text-anchor="middle">OS-level abstraction</text><text class="t" x="195" y="232" text-anchor="middle">ABI for process / OS interaction</text>
  <line class="arrow" x1="195" y1="252" x2="195" y2="278"/><rect class="card isa" x="30" y="280" width="330" height="72"/><text class="k" x="195" y="308" text-anchor="middle">Machine-level abstraction</text><text class="t" x="195" y="332" text-anchor="middle">ISA presented to a machine environment</text>
  <line class="arrow" x1="195" y1="352" x2="195" y2="378"/><rect class="card sys" x="30" y="380" width="330" height="72"/><text class="k" x="195" y="408" text-anchor="middle">System abstraction</text><text class="t" x="195" y="432" text-anchor="middle">A usable system environment boundary</text>
  <line class="arrow" x1="195" y1="452" x2="195" y2="478"/><rect class="card phy" x="30" y="480" width="330" height="72"/><text class="k" x="195" y="508" text-anchor="middle">Physical resources</text><text class="t" x="195" y="532" text-anchor="middle">CPU · memory · storage · network</text>
  <text class="t" x="195" y="592" text-anchor="middle">Do not assume every workload uses every level</text><text class="t" x="195" y="612" text-anchor="middle">in the same way.</text>
</svg>