<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" role="img" aria-labelledby="title desc">
  <title id="title">ACL packet filtering flow</title>
  <desc id="desc">A packet reaches an interface in an inbound or outbound direction. ACL entries are evaluated from top to bottom; the first matching rule permits or denies the packet.</desc>
  <rect width="390" height="720" fill="#f7fafc"/>
  <text x="195" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#12335b">ACL FILTER FLOW</text>
  <text x="195" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#40566d">Packet -> rule order -> decision</text>

  <rect x="18" y="82" width="104" height="74" rx="12" fill="#e5f4ff" stroke="#2995c5" stroke-width="2"/>
  <text x="70" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">PACKET</text>
  <text x="70" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#08668f">SIP / DIP / proto</text>
  <line x1="122" y1="119" x2="145" y2="119" stroke="#0284c7" stroke-width="4"/>
  <polygon points="145,119 136,113 136,125" fill="#0284c7"/>

  <rect x="145" y="74" width="100" height="90" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="195" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">ACL</text>
  <text x="195" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#a95f00">in / out</text>
  <text x="195" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#40566d">interface</text>
  <line x1="245" y1="119" x2="268" y2="119" stroke="#ea580c" stroke-width="4"/>
  <polygon points="268,119 259,113 259,125" fill="#ea580c"/>

  <rect x="268" y="82" width="104" height="74" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">RESULT</text>
  <text x="320" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#087245">permit / deny</text>

  <rect x="18" y="198" width="354" height="206" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="36" y="229" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#12335b">Đọc ACL từ trên xuống</text>
  <rect x="36" y="248" width="318" height="37" rx="7" fill="#fee2e2"/>
  <text x="49" y="272" font-family="ui-monospace,monospace" font-size="12" fill="#991b1b">1. deny 192.168.1.0/24</text>
  <text x="338" y="272" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#991b1b">MATCH -> stop</text>
  <rect x="36" y="294" width="318" height="37" rx="7" fill="#dcfce7"/>
  <text x="49" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#166534">2. permit tcp any host Server</text>
  <text x="338" y="318" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#166534">next if no match</text>
  <rect x="36" y="340" width="318" height="37" rx="7" fill="#f1f5f9"/>
  <text x="49" y="364" font-family="ui-monospace,monospace" font-size="12" fill="#475569">3. implicit deny</text>
  <text x="338" y="364" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#475569">no match</text>

  <rect x="18" y="432" width="170" height="122" rx="14" fill="#e5f4ff" stroke="#2995c5" stroke-width="2"/>
  <text x="103" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">STANDARD</text>
  <text x="103" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#40566d">chủ yếu theo source</text>
  <text x="103" y="511" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#08668f">gần destination</text>
  <text x="103" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#40566d">heuristic placement</text>
  <rect x="202" y="432" width="170" height="122" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="287" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">EXTENDED</text>
  <text x="287" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#40566d">source, dest, protocol</text>
  <text x="287" y="511" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a95f00">gần source</text>
  <text x="287" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#40566d">heuristic placement</text>

  <rect x="18" y="582" width="354" height="103" rx="14" fill="#12335b"/>
  <text x="195" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">ĐIỂM KIỂM TRA</text>
  <text x="195" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#dbeafe">ACL nào? Gắn vào interface nào?</text>
  <text x="195" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#dbeafe">Hướng in/out? Rule nào match trước?</text>
</svg>
