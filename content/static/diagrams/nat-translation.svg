<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" role="img" aria-labelledby="title desc">
  <title id="title">NAT and PAT translation path</title>
  <desc id="desc">A private inside host sends through a NAT router. PAT maps the inside local address and source port to an inside global address and another port, then reverses the mapping for the reply.</desc>
  <rect width="390" height="720" fill="#f7fafc"/>
  <text x="195" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#12335b">NAT / PAT</text>
  <text x="195" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#40566d">Bảng dịch nối hai cách nhìn về địa chỉ</text>

  <rect x="18" y="82" width="106" height="91" rx="12" fill="#e5f4ff" stroke="#2995c5" stroke-width="2"/>
  <text x="71" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#12335b">INSIDE</text>
  <text x="71" y="137" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#08668f">10.0.0.1:3345</text>
  <text x="71" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#40566d">inside local</text>

  <rect x="142" y="72" width="106" height="111" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="195" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#12335b">NAT R</text>
  <text x="195" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a95f00">lookup / create</text>
  <text x="195" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a95f00">translation entry</text>
  <text x="195" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#40566d">PAT uses port</text>

  <rect x="266" y="82" width="106" height="91" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="319" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#12335b">OUTSIDE</text>
  <text x="319" y="137" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#087245">128.119.40.186:80</text>
  <text x="319" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#40566d">server</text>

  <line x1="124" y1="128" x2="142" y2="128" stroke="#0284c7" stroke-width="3"/>
  <polygon points="142,128 134,123 134,133" fill="#0284c7"/>
  <line x1="248" y1="128" x2="266" y2="128" stroke="#16a34a" stroke-width="3"/>
  <polygon points="266,128 258,123 258,133" fill="#16a34a"/>

  <rect x="18" y="215" width="354" height="142" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="36" y="245" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#12335b">Đi ra: mapping được tạo</text>
  <text x="36" y="274" font-family="ui-monospace,monospace" font-size="13" fill="#40566d">10.0.0.1:3345</text>
  <text x="36" y="298" font-family="Arial,sans-serif" font-size="14" fill="#64748b">được đổi thành</text>
  <text x="36" y="325" font-family="ui-monospace,monospace" font-size="13" fill="#087245">138.76.29.7:5001</text>
  <text x="36" y="346" font-family="Arial,sans-serif" font-size="12" fill="#40566d">cùng đích IP server, khác địa chỉ/cổng nguồn</text>

  <rect x="18" y="381" width="354" height="142" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="36" y="411" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#12335b">Translation table</text>
  <text x="36" y="442" font-family="ui-monospace,monospace" font-size="12" fill="#40566d">inside local   inside global</text>
  <text x="36" y="469" font-family="ui-monospace,monospace" font-size="13" fill="#087245">10.0.0.1:3345 -> 138.76.29.7:5001</text>
  <text x="36" y="499" font-family="Arial,sans-serif" font-size="13" fill="#40566d">Reply đến cổng 5001 được tra ngược về host bên trong.</text>

  <rect x="18" y="548" width="354" height="143" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="36" y="578" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">Port forwarding</text>
  <text x="36" y="608" font-family="ui-monospace,monospace" font-size="12" fill="#a95f00">public:8080 -> inside:10.0.0.10:80</text>
  <text x="36" y="636" font-family="Arial,sans-serif" font-size="13" fill="#40566d">Mapping tĩnh cho dịch vụ nội bộ được truy cập từ ngoài.</text>
  <text x="36" y="666" font-family="Arial,sans-serif" font-size="12" fill="#64748b">NAT đổi địa chỉ theo rule; không phải firewall thay thế.</text>
</svg>
