<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" role="img" aria-labelledby="title desc">
  <title id="title">Linux name resolution pipeline</title>
  <desc id="desc">An application asks the system resolver. NSS and resolver policy select the configured lookup sources and order; local files and DNS are examples, not a universal sequence.</desc>
  <style>
    .bg{fill:#f8fafc}.title{font:700 21px sans-serif;fill:#0f172a}.sub{font:12px sans-serif;fill:#475569}
    .box{fill:#fff;stroke:#2563eb;stroke-width:2;rx:10}.source{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}.result{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}
    .h{font:700 15px sans-serif;fill:#0f172a}.t{font:12px sans-serif;fill:#334155}.line{stroke:#475569;stroke-width:3}
  </style>
  <rect class="bg" width="390" height="520"/>
  <line class="line" x1="195" y1="122" x2="195" y2="140"/><line class="line" x1="195" y1="182" x2="195" y2="200"/><path class="line" fill="none" d="M170 252 L112 280"/><path class="line" fill="none" d="M220 252 L278 280"/><path class="line" fill="none" d="M112 332 L112 360 L195 360"/><path class="line" fill="none" d="M278 332 L278 360 L195 360"/><line class="line" x1="195" y1="402" x2="195" y2="420"/>
  <rect class="box" x="28" y="77" width="334" height="45"/><rect class="box" x="28" y="140" width="334" height="42"/><rect class="box" x="28" y="200" width="334" height="52"/><rect class="source" x="20" y="280" width="164" height="52"/><rect class="source" x="206" y="280" width="164" height="52"/><rect class="result" x="28" y="360" width="334" height="42"/><rect class="result" x="28" y="420" width="334" height="45"/>
  <text class="title" x="195" y="29" text-anchor="middle">Name resolution pipeline</text>
  <text class="sub" x="195" y="50" text-anchor="middle">the exact order comes from the active policy</text>
  <text class="h" x="195" y="105" text-anchor="middle">Application asks for hostname</text><text class="h" x="195" y="167" text-anchor="middle">System resolver</text><text class="h" x="195" y="222" text-anchor="middle">NSS / resolver policy selects</text><text class="t" x="195" y="240" text-anchor="middle">configured sources and lookup order</text><text class="h" x="102" y="303" text-anchor="middle">Local files</text><text class="t" x="102" y="320" text-anchor="middle">for example /etc/hosts</text><text class="h" x="288" y="303" text-anchor="middle">DNS resolver</text><text class="t" x="288" y="320" text-anchor="middle">when policy selects DNS</text><text class="h" x="195" y="387" text-anchor="middle">Answer or next source by policy</text><text class="h" x="195" y="448" text-anchor="middle">Application receives address/result</text>
</svg>
