<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" role="img" aria-labelledby="title desc">
  <title id="title">Linux name resolution pipeline</title>
  <desc id="desc">An application asks the system resolver, which follows NSS policy and local sources before using a configured DNS resolver and returning an answer.</desc>
  <style>
    .bg{fill:#f8fafc}.title{font:700 21px sans-serif;fill:#0f172a}.sub{font:12px sans-serif;fill:#475569}
    .box{fill:#fff;stroke:#2563eb;stroke-width:2;rx:10}.source{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}.result{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}
    .h{font:700 15px sans-serif;fill:#0f172a}.t{font:12px sans-serif;fill:#334155}.line{stroke:#475569;stroke-width:3}
  </style>
  <rect class="bg" width="390" height="520"/>
  <line class="line" x1="195" y1="122" x2="195" y2="140"/><line class="line" x1="195" y1="182" x2="195" y2="200"/><line class="line" x1="195" y1="242" x2="195" y2="260"/><line class="line" x1="195" y1="302" x2="195" y2="320"/><line class="line" x1="195" y1="362" x2="195" y2="380"/>
  <rect class="box" x="28" y="77" width="334" height="45"/><rect class="box" x="28" y="140" width="334" height="42"/><rect class="source" x="28" y="200" width="334" height="42"/><rect class="box" x="28" y="260" width="334" height="42"/><rect class="result" x="28" y="320" width="334" height="42"/><rect class="result" x="28" y="380" width="334" height="45"/>
  <text class="title" x="195" y="29" text-anchor="middle">Name resolution pipeline</text>
  <text class="sub" x="195" y="50" text-anchor="middle">the exact order comes from the active policy</text>
  <text class="h" x="195" y="105" text-anchor="middle">Application asks for hostname</text><text class="h" x="195" y="167" text-anchor="middle">System resolver / NSS policy</text><text class="h" x="195" y="227" text-anchor="middle">Local sources such as /etc/hosts</text><text class="h" x="195" y="287" text-anchor="middle">Configured DNS resolver</text><text class="h" x="195" y="347" text-anchor="middle">Answer</text><text class="h" x="195" y="408" text-anchor="middle">Application receives address/result</text>
</svg>
