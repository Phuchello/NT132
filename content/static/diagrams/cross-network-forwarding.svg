<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" width="100%" height="700" preserveAspectRatio="xMidYMin meet">
  <title>Chuyển tiếp gói tin liên mạng từ PC-A đến PC-B</title>
  <desc>Địa chỉ IP giữ nguyên end-to-end; địa chỉ MAC được viết lại qua từng hop giữa PC-A, R1, R2 và PC-B.</desc>

  <defs>
    <linearGradient id="crossHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="360" height="700" fill="#ffffff" rx="10"/>

  <!-- Title -->
  <rect x="12" y="12" width="336" height="45" rx="7" fill="url(#crossHdr)"/>
  <text x="180" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    CHUYỂN TIẾP LIÊN MẠNG
  </text>
  <text x="180" y="48" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">
    3 HOPS · TỪ PC-A ĐẾN PC-B
  </text>

  <!-- End-to-end path -->
  <g font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="18" y="72" width="58" height="32" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="47" y="92" fill="#075985">PC-A</text>
    <text x="89" y="94" fill="#64748b" font-size="18">→</text>
    <rect x="102" y="72" width="48" height="32" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="126" y="92" fill="#1e3a8a">R1</text>
    <text x="163" y="94" fill="#64748b" font-size="18">→</text>
    <rect x="176" y="72" width="48" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="200" y="92" fill="#92400e">R2</text>
    <text x="237" y="94" fill="#64748b" font-size="18">→</text>
    <rect x="250" y="72" width="74" height="32" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="287" y="92" fill="#065f46">PC-B</text>
  </g>

  <!-- Invariants -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="15" y="118" width="160" height="58" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="95" y="139" fill="#1d4ed8" font-size="11" font-weight="bold">IP (L3)</text>
    <text x="95" y="158" fill="#0f172a" font-size="13" font-weight="bold">END-TO-END</text>
    <rect x="185" y="118" width="160" height="58" rx="7" fill="#ecfdf5" stroke="#86efac"/>
    <text x="265" y="139" fill="#047857" font-size="11" font-weight="bold">MAC (L2)</text>
    <text x="265" y="158" fill="#0f172a" font-size="13" font-weight="bold">HOP-BY-HOP</text>
  </g>

  <!-- Hop 1 -->
  <g>
    <rect x="15" y="190" width="330" height="132" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="15" y="190" width="330" height="28" rx="8" fill="#0284c7"/>
    <text x="30" y="209" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CHẶNG 1 · PC-A → R1</text>
    <text x="30" y="241" fill="#0369a1" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">IP (L3)</text>
    <text x="30" y="257" fill="#0f172a" font-family="monospace" font-size="11">SIP  192.168.10.10</text>
    <text x="30" y="272" fill="#0f172a" font-family="monospace" font-size="11">DIP  192.168.20.20</text>
    <text x="30" y="291" fill="#0369a1" font-family="monospace" font-size="11" font-weight="bold">MAC  AAAA → 1111</text>
    <text x="30" y="309" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">R1 giữ IP · đổi frame MAC</text>
  </g>
  <text x="180" y="343" fill="#d97706" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">▼</text>

  <!-- Hop 2 -->
  <g>
    <rect x="15" y="355" width="330" height="132" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="355" width="330" height="28" rx="8" fill="#d97706"/>
    <text x="30" y="374" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CHẶNG 2 · R1 → R2</text>
    <text x="30" y="406" fill="#92400e" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">IP (L3) · GIỮ NGUYÊN</text>
    <text x="30" y="422" fill="#0f172a" font-family="monospace" font-size="11">SIP  192.168.10.10</text>
    <text x="30" y="437" fill="#0f172a" font-family="monospace" font-size="11">DIP  192.168.20.20</text>
    <text x="30" y="456" fill="#b45309" font-family="monospace" font-size="11" font-weight="bold">MAC  2222 → 3333</text>
    <text x="30" y="474" fill="#78350f" font-family="system-ui, sans-serif" font-size="10.5">R1 viết lại MAC cho hop kế tiếp</text>
  </g>
  <text x="180" y="508" fill="#059669" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">▼</text>

  <!-- Hop 3 -->
  <g>
    <rect x="15" y="520" width="330" height="132" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
    <rect x="15" y="520" width="330" height="28" rx="8" fill="#059669"/>
    <text x="30" y="539" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CHẶNG 3 · R2 → PC-B</text>
    <text x="30" y="571" fill="#047857" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">IP (L3) · GIỮ NGUYÊN</text>
    <text x="30" y="587" fill="#0f172a" font-family="monospace" font-size="11">SIP  192.168.10.10</text>
    <text x="30" y="602" fill="#0f172a" font-family="monospace" font-size="11">DIP  192.168.20.20</text>
    <text x="30" y="621" fill="#059669" font-family="monospace" font-size="11" font-weight="bold">MAC  4444 → BBBB</text>
    <text x="30" y="639" fill="#065f46" font-family="system-ui, sans-serif" font-size="10.5">PC-B nhận frame · bóc L2 · nhận IP</text>
  </g>

  <!-- Takeaway -->
  <text x="180" y="675" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">IP không đổi từ nguồn đến đích</text>
  <text x="180" y="691" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MAC đổi theo từng hop</text>
</svg>
