<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <!-- Title Banner -->
  <rect x="20" y="16" width="840" height="42" rx="8" fill="url(#headerGrad)"/>
  <text x="440" y="42" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    CHUYỂN TIẾP TRONG CÙNG MẠNG LAN (SAME-SUBNET FORWARDING)
  </text>

  <!-- Subnet Box -->
  <rect x="30" y="70" width="820" height="350" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="50" y="96" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">
    Mạng LAN cục bộ: 192.168.10.0/24 (Broadcast Domain)
  </text>

  <!-- PC-A -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="180" height="130" rx="8" fill="url(#boxGrad)" stroke="#0284c7" stroke-width="2"/>
    <rect width="180" height="28" rx="8" fill="#0284c7"/>
    <rect y="20" width="180" height="8" fill="#0284c7"/>
    <text x="90" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PC-A (Nguồn)</text>
    <text x="12" y="52" fill="#334155" font-family="monospace" font-size="11">IP:  192.168.10.5/24</text>
    <text x="12" y="74" fill="#334155" font-family="monospace" font-size="11">MAC: 0000.AAAA.0001</text>
    <text x="12" y="96" fill="#334155" font-family="monospace" font-size="11">GW:  192.168.10.1</text>
    <text x="12" y="118" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Cổng kết nối: Gi0/1</text>
  </g>

  <!-- Switch S1 -->
  <g transform="translate(350, 120)" filter="url(#shadow)">
    <rect width="180" height="150" rx="8" fill="url(#boxGrad)" stroke="#0f766e" stroke-width="2"/>
    <rect width="180" height="28" rx="8" fill="#0f766e"/>
    <rect y="20" width="180" height="8" fill="#0f766e"/>
    <text x="90" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Switch SW1 (Layer 2)</text>
    
    <!-- MAC Table preview inside Switch -->
    <rect x="10" y="38" width="160" height="75" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="90" y="52" fill="#0f766e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MAC Address Table</text>
    <line x1="10" y1="56" x2="170" y2="56" stroke="#e2e8f0"/>
    <text x="16" y="70" fill="#334155" font-family="monospace" font-size="9.5">Port Gi0/1: ...AAAA.0001</text>
    <text x="16" y="86" fill="#334155" font-family="monospace" font-size="9.5">Port Gi0/2: ...BBBB.0002</text>
    <text x="16" y="102" fill="#0284c7" font-family="system-ui, sans-serif" font-size="9.5">Action: Forward port 2</text>

    <text x="90" y="134" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Không cần Router</text>
  </g>

  <!-- PC-B -->
  <g transform="translate(640, 130)" filter="url(#shadow)">
    <rect width="180" height="130" rx="8" fill="url(#boxGrad)" stroke="#059669" stroke-width="2"/>
    <rect width="180" height="28" rx="8" fill="#059669"/>
    <rect y="20" width="180" height="8" fill="#059669"/>
    <text x="90" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PC-B (Đích)</text>
    <text x="12" y="52" fill="#334155" font-family="monospace" font-size="11">IP:  192.168.10.20/24</text>
    <text x="12" y="74" fill="#334155" font-family="monospace" font-size="11">MAC: 0000.BBBB.0002</text>
    <text x="12" y="96" fill="#334155" font-family="monospace" font-size="11">GW:  192.168.10.1</text>
    <text x="12" y="118" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Cổng kết nối: Gi0/2</text>
  </g>

  <!-- Connecting Lines -->
  <line x1="240" y1="195" x2="350" y2="195" stroke="#0284c7" stroke-width="3"/>
  <line x1="530" y1="195" x2="640" y2="195" stroke="#059669" stroke-width="3"/>

  <!-- Packet/Frame Callout Flow -->
  <g transform="translate(130, 290)" filter="url(#shadow)">
    <rect width="620" height="110" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="620" height="24" rx="8" fill="#e0f2fe"/>
    <text x="310" y="17" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">
      CẤU TRÚC FRAME ETHERNET CHUYỂN TIẾP TRONG LAN
    </text>

    <!-- Header breakdown -->
    <rect x="20" y="36" width="135" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="87" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Destination MAC</text>
    <text x="87" y="68" fill="#0f172a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">0000.BBBB.0002</text>

    <rect x="165" y="36" width="135" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="232" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Source MAC</text>
    <text x="232" y="68" fill="#0f172a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">0000.AAAA.0001</text>

    <rect x="310" y="36" width="135" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="377" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Source IP (SIP)</text>
    <text x="377" y="68" fill="#0369a1" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">192.168.10.5</text>

    <rect x="455" y="36" width="145" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="527" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Destination IP (DIP)</text>
    <text x="527" y="68" fill="#0369a1" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">192.168.10.20</text>

    <text x="310" y="96" fill="#334155" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
      <tspan font-weight="bold">Quy tắc:</tspan> Vì DIP cùng dải mạng /24 với SIP, PC-A gửi thẳng đến MAC của PC-B mà không qua Router.
    </text>
  </g>
</svg>
