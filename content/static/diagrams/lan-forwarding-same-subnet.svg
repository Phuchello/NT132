<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lanHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="10"/>

  <!-- Title -->
  <rect x="12" y="12" width="396" height="38" rx="6" fill="url(#lanHdr)"/>
  <text x="210" y="36" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    CHUYỂN TIẾP TRONG CÙNG MẠNG LAN (L2)
  </text>

  <!-- Subnet Label -->
  <rect x="12" y="56" width="396" height="24" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="210" y="72" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">
    Mạng LAN cục bộ: 192.168.10.0/24 (Cùng Broadcast Domain)
  </text>

  <!-- PC-A Card -->
  <g transform="translate(15, 90)" filter="url(#cardShadow)">
    <rect width="175" height="110" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="175" height="24" rx="6" fill="#0284c7"/>
    <text x="87" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PC-A (Nguồn)</text>
    <text x="10" y="44" fill="#334155" font-family="monospace" font-size="11">IP: .10.5/24</text>
    <text x="10" y="64" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold">MAC: AAAA</text>
    <text x="10" y="84" fill="#64748b" font-family="monospace" font-size="10.5">GW: .10.1</text>
    <text x="10" y="102" fill="#0284c7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">→ Cắm vào Port 1</text>
  </g>

  <!-- PC-B Card -->
  <g transform="translate(230, 90)" filter="url(#cardShadow)">
    <rect width="175" height="110" rx="6" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <rect width="175" height="24" rx="6" fill="#059669"/>
    <text x="87" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PC-B (Đích)</text>
    <text x="10" y="44" fill="#334155" font-family="monospace" font-size="11">IP: .10.20/24</text>
    <text x="10" y="64" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold">MAC: BBBB</text>
    <text x="10" y="84" fill="#64748b" font-family="monospace" font-size="10.5">GW: .10.1</text>
    <text x="10" y="102" fill="#059669" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">→ Cắm vào Port 2</text>
  </g>

  <!-- Connecting Lines to Switch -->
  <line x1="102" y1="200" x2="150" y2="230" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="318" y1="200" x2="270" y2="230" stroke="#059669" stroke-width="2.5"/>

  <!-- Switch Card -->
  <g transform="translate(40, 220)" filter="url(#cardShadow)">
    <rect width="340" height="115" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <rect width="340" height="24" rx="6" fill="#0f766e"/>
    <text x="170" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Switch SW1 (Layer 2 Forwarding)
    </text>

    <!-- Table inside switch -->
    <rect x="12" y="32" width="316" height="50" rx="4" fill="#f0fdfa" stroke="#ccfbf1"/>
    <text x="20" y="48" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Bảng MAC (CAM Table):</text>
    <text x="20" y="68" fill="#134e4a" font-family="monospace" font-size="11">Port 1 ↔ MAC AAAA  |  Port 2 ↔ MAC BBBB</text>

    <text x="170" y="102" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      ✓ Forward chính xác ra Port 2 — Không cần Router
    </text>
  </g>

  <!-- Frame Header Box -->
  <g transform="translate(15, 350)" filter="url(#cardShadow)">
    <rect width="390" height="135" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect width="390" height="24" rx="6" fill="#e2e8f0"/>
    <text x="195" y="17" fill="#1e293b" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">
      CẤU TRÚC ETHERNET FRAME TRONG LAN
    </text>

    <!-- 4 Field Boxes 2x2 for mobile clarity -->
    <rect x="12" y="34" width="178" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="49" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Destination MAC</text>
    <text x="20" y="67" fill="#059669" font-family="monospace" font-size="12" font-weight="bold">BBBB (PC-B)</text>

    <rect x="200" y="34" width="178" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="208" y="49" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Source MAC</text>
    <text x="208" y="67" fill="#0284c7" font-family="monospace" font-size="12" font-weight="bold">AAAA (PC-A)</text>

    <rect x="12" y="82" width="178" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="97" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Destination IP (DIP)</text>
    <text x="20" y="115" fill="#059669" font-family="monospace" font-size="12" font-weight="bold">192.168.10.20</text>

    <rect x="200" y="82" width="178" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="208" y="97" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Source IP (SIP)</text>
    <text x="208" y="115" fill="#0284c7" font-family="monospace" font-size="12" font-weight="bold">192.168.10.5</text>
  </g>
</svg>
