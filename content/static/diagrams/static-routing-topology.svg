<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="100%" height="100%">
  <defs>
    <linearGradient id="srHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="srSh" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="10"/>

  <!-- Title -->
  <rect x="12" y="12" width="396" height="38" rx="6" fill="url(#srHdr)"/>
  <text x="210" y="36" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    4 LOẠI STATIC ROUTE TRONG THỰC TẾ
  </text>

  <!-- Topology Bar Top -->
  <g transform="translate(15, 60)" filter="url(#srSh)">
    <rect width="390" height="90" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect width="390" height="22" rx="6" fill="#475569"/>
    <text x="195" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      MÔ HÌNH TOPOLOGY THAM CHIẾU
    </text>

    <!-- Node R1 -->
    <rect x="14" y="30" width="105" height="50" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="66" y="47" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">R1 (Stub)</text>
    <text x="66" y="65" fill="#334155" font-family="monospace" font-size="9.5" text-anchor="middle">LAN: .10.0/24</text>

    <!-- Link R1-R2 -->
    <line x1="120" y1="50" x2="160" y2="50" stroke="#0284c7" stroke-width="2"/>
    <text x="140" y="44" fill="#0284c7" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Primary</text>
    <line x1="120" y1="62" x2="160" y2="62" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="140" y="74" fill="#ea580c" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Backup</text>

    <!-- Node R2 (HQ) -->
    <rect x="162" y="30" width="95" height="50" rx="4" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="209" y="47" fill="#0f766e" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">R2 (HQ Core)</text>
    <text x="209" y="65" fill="#334155" font-family="monospace" font-size="9.5" text-anchor="middle">WAN 10.3.3.1</text>

    <!-- Link R2-R3 -->
    <line x1="258" y1="55" x2="298" y2="55" stroke="#059669" stroke-width="2"/>

    <!-- Node R3 (Branch) -->
    <rect x="300" y="30" width="76" height="50" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="338" y="47" fill="#047857" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">R3</text>
    <text x="338" y="65" fill="#334155" font-family="monospace" font-size="8.5" text-anchor="middle">4 Subnets</text>
  </g>

  <!-- 4 Route Type Cards -->
  <!-- 1. Standard Static Route -->
  <g transform="translate(15, 160)" filter="url(#srSh)">
    <rect width="390" height="85" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="390" height="22" rx="6" fill="#0284c7"/>
    <text x="14" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      1. Standard Static Route (Tuyến đường tiêu chuẩn)
    </text>
    <text x="14" y="40" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">Trỏ đến một mạng đích cụ thể với subnet mask xác định.</text>
    <rect x="12" y="48" width="366" height="26" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="20" y="65" fill="#0369a1" font-family="monospace" font-size="10.5" font-weight="bold">
      ip route 192.168.10.0 255.255.255.0 10.3.3.1
    </text>
  </g>

  <!-- 2. Default Static Route -->
  <g transform="translate(15, 255)" filter="url(#srSh)">
    <rect width="390" height="85" rx="6" fill="#ffffff" stroke="#1e40af" stroke-width="1.5"/>
    <rect width="390" height="22" rx="6" fill="#1e40af"/>
    <text x="14" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      2. Default Static Route (Gateway of Last Resort)
    </text>
    <text x="14" y="40" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">Khớp mọi địa chỉ không có trong bảng routing (dùng cho Stub R1).</text>
    <rect x="12" y="48" width="366" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="20" y="65" fill="#1e40af" font-family="monospace" font-size="10.5" font-weight="bold">
      ip route 0.0.0.0 0.0.0.0 10.1.1.2
    </text>
  </g>

  <!-- 3. Summary Static Route -->
  <g transform="translate(15, 350)" filter="url(#srSh)">
    <rect width="390" height="95" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="390" height="22" rx="6" fill="#0f766e"/>
    <text x="14" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      3. Summary Static Route (Route tóm tắt dải mạng)
    </text>
    <text x="14" y="40" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">Gộp 4 dải mạng /24 tại R3 thành 1 route duy nhất /22 trên R2.</text>
    <rect x="12" y="48" width="366" height="34" rx="4" fill="#f0fdfa" stroke="#ccfbf1"/>
    <text x="20" y="63" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">172.16.0.0/24 ... 172.16.3.0/24 → 172.16.0.0/22</text>
    <text x="20" y="77" fill="#0f766e" font-family="monospace" font-size="10" font-weight="bold">
      ip route 172.16.0.0 255.255.252.0 10.3.3.2
    </text>
  </g>

  <!-- 4. Floating Static Route -->
  <g transform="translate(15, 455)" filter="url(#srSh)">
    <rect width="390" height="95" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
    <rect width="390" height="22" rx="6" fill="#c2410c"/>
    <text x="14" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      4. Floating Static Route (Tuyến dự phòng nổi)
    </text>
    <text x="14" y="40" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">Gán AD cao hơn route chính (AD 10 > AD 1); chỉ kích hoạt khi link chính đứt.</text>
    <rect x="12" y="48" width="366" height="34" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="20" y="63" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">Đường chính (AD 1): ip route 0.0.0.0 0.0.0.0 10.1.1.2</text>
    <text x="20" y="77" fill="#c2410c" font-family="monospace" font-size="10" font-weight="bold">
      ip route 0.0.0.0 0.0.0.0 10.2.2.2 10
    </text>
  </g>
</svg>
