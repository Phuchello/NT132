<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" role="img" aria-labelledby="title desc">
  <title id="title">DHCP DORA and relay path</title>
  <desc id="desc">A DHCP client sends Discover and Request as local broadcasts. A relay forwards the request to a remote server, which returns Offer and ACK through the relay.</desc>
  <rect width="390" height="760" fill="#f7fafc"/>
  <text x="195" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#12335b">DHCP: DORA</text>
  <text x="195" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#40566d">Cấp tham số mạng và chuyển tiếp broadcast</text>

  <rect x="18" y="80" width="106" height="76" rx="12" fill="#e5f4ff" stroke="#2995c5" stroke-width="2"/>
  <text x="71" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">CLIENT</text>
  <text x="71" y="134" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#08668f">UDP 68</text>
  <rect x="142" y="80" width="106" height="76" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="195" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">RELAY</text>
  <text x="195" y="134" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#a95f00">ip helper</text>
  <rect x="266" y="80" width="106" height="76" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="319" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">SERVER</text>
  <text x="319" y="134" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#087245">UDP 67</text>

  <line x1="124" y1="112" x2="142" y2="112" stroke="#0284c7" stroke-width="3"/>
  <polygon points="142,112 134,107 134,117" fill="#0284c7"/>
  <line x1="248" y1="112" x2="266" y2="112" stroke="#ea580c" stroke-width="3"/>
  <polygon points="266,112 258,107 258,117" fill="#ea580c"/>

  <rect x="18" y="185" width="354" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="36" y="213" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#12335b">1. Discover</text>
  <text x="36" y="238" font-family="Arial,sans-serif" font-size="14" fill="#40566d">Client chưa có IP, gửi broadcast trong LAN.</text>
  <text x="36" y="262" font-family="ui-monospace,monospace" font-size="12" fill="#08668f">src 0.0.0.0:68 -> 255.255.255.255:67</text>
  <text x="36" y="288" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Relay cần xử lý vì broadcast không tự đi qua router.</text>

  <rect x="18" y="329" width="354" height="96" rx="14" fill="#e5f4ff" stroke="#2995c5" stroke-width="2"/>
  <text x="36" y="357" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#12335b">2. Offer</text>
  <text x="36" y="383" font-family="Arial,sans-serif" font-size="14" fill="#40566d">Server đề nghị địa chỉ và thời gian thuê.</text>
  <text x="36" y="407" font-family="ui-monospace,monospace" font-size="12" fill="#08668f">yiaddr + lifetime + gateway/DNS</text>

  <rect x="18" y="439" width="354" height="96" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="36" y="467" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#12335b">3. Request</text>
  <text x="36" y="493" font-family="Arial,sans-serif" font-size="14" fill="#40566d">Client chọn offer và thông báo lựa chọn.</text>
  <text x="36" y="517" font-family="ui-monospace,monospace" font-size="12" fill="#a95f00">transaction ID phải khớp phiên trao đổi</text>

  <rect x="18" y="549" width="354" height="96" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="36" y="577" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#12335b">4. ACK</text>
  <text x="36" y="603" font-family="Arial,sans-serif" font-size="14" fill="#40566d">Server xác nhận lease và các option.</text>
  <text x="36" y="627" font-family="ui-monospace,monospace" font-size="12" fill="#087245">client dùng cấu hình sau khi hoàn tất</text>

  <rect x="18" y="674" width="354" height="63" rx="12" fill="#12335b"/>
  <text x="195" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">RELAY CHECK</text>
  <text x="195" y="721" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#dbeafe">interface VLAN -> ip helper-address -> server</text>
</svg>
