<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 560" role="img" aria-labelledby="title desc">
  <title id="title">Linux Server service map</title>
  <desc id="desc">Linux Server independently hosts Web and DNS, File and Data, Monitoring, Proxy, VPN, and DHCP or NAT service groups.</desc>
  <style>
    .bg{fill:#f8fafc}.title{font:700 22px sans-serif;fill:#0f172a}.sub{font:13px sans-serif;fill:#475569}
    .core{fill:#dcfce7;stroke:#15803d;stroke-width:2;rx:14}.svc{fill:#fff;stroke:#16a34a;stroke-width:2;rx:10}
    .h{font:700 14px sans-serif;fill:#0f172a}.t{font:12px sans-serif;fill:#334155}.small{font:11px sans-serif;fill:#64748b}
    .line{stroke:#16a34a;stroke-width:2.5;fill:none}
  </style>
  <rect class="bg" width="390" height="560"/>
  <!-- The side route and both buses remain platform-level distribution paths. -->
  <line class="line" x1="195" y1="150" x2="195" y2="178"/>
  <line class="line" x1="28" y1="178" x2="362" y2="178"/>
  <line class="line" x1="68" y1="178" x2="68" y2="212"/>
  <line class="line" x1="195" y1="178" x2="195" y2="212"/>
  <line class="line" x1="322" y1="178" x2="322" y2="212"/>
  <line class="line" x1="28" y1="178" x2="6" y2="200"/>
  <line class="line" x1="6" y1="200" x2="6" y2="346"/>
  <line class="line" x1="6" y1="346" x2="68" y2="346"/>
  <line class="line" x1="68" y1="346" x2="322" y2="346"/>
  <line class="line" x1="68" y1="346" x2="68" y2="366"/>
  <line class="line" x1="195" y1="346" x2="195" y2="366"/>
  <line class="line" x1="322" y1="346" x2="322" y2="366"/>
  <rect class="core" x="85" y="78" width="220" height="72"/>
  <rect class="svc" x="14" y="212" width="112" height="88"/>
  <rect class="svc" x="139" y="212" width="112" height="88"/>
  <rect class="svc" x="264" y="212" width="112" height="88"/>
  <rect class="svc" x="14" y="366" width="112" height="88"/>
  <rect class="svc" x="139" y="366" width="112" height="88"/>
  <rect class="svc" x="264" y="366" width="112" height="88"/>
  <text class="title" x="195" y="34" text-anchor="middle">Linux Server</text>
  <text class="sub" x="195" y="56" text-anchor="middle">platform cho nhiều service purpose</text>
  <text class="h" x="195" y="108" text-anchor="middle">Linux Server</text>
  <text class="t" x="195" y="131" text-anchor="middle">OS + daemon + package + permission</text>
  <text class="h" x="70" y="244" text-anchor="middle">Web / DNS</text>
  <text class="small" x="70" y="266" text-anchor="middle">app + name</text>
  <text class="small" x="70" y="282" text-anchor="middle">resolution</text>
  <text class="h" x="195" y="244" text-anchor="middle">File / Data</text>
  <text class="small" x="195" y="266" text-anchor="middle">NFS · SMB · FTP</text>
  <text class="small" x="195" y="282" text-anchor="middle">different models</text>
  <text class="h" x="320" y="244" text-anchor="middle">Monitoring</text>
  <text class="small" x="320" y="266" text-anchor="middle">Nagios / Zabbix</text>
  <text class="small" x="320" y="282" text-anchor="middle">checks → alert</text>
  <text class="h" x="70" y="398" text-anchor="middle">Proxy</text>
  <text class="small" x="70" y="420" text-anchor="middle">Squid · policy</text>
  <text class="small" x="70" y="438" text-anchor="middle">not a router</text>
  <text class="h" x="195" y="398" text-anchor="middle">VPN</text>
  <text class="small" x="195" y="420" text-anchor="middle">tunnel → route</text>
  <text class="small" x="195" y="438" text-anchor="middle">resource policy</text>
  <text class="h" x="320" y="398" text-anchor="middle">DHCP / NAT</text>
  <text class="small" x="320" y="420" text-anchor="middle">infrastructure</text>
  <text class="small" x="320" y="438" text-anchor="middle">separate ownership</text>
  <text class="sub" x="195" y="500" text-anchor="middle">service groups are independent choices</text>
  <text class="small" x="195" y="520" text-anchor="middle">không phải processing chain</text>
</svg>
