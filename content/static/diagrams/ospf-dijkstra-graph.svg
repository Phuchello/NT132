<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="ospfHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <filter id="ospfShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <!-- Title Banner -->
  <rect x="20" y="14" width="920" height="42" rx="8" fill="url(#ospfHeader)"/>
  <text x="480" y="40" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    MÔ HÌNH ĐỒ THỊ LINK-STATE &amp; CÂY ĐƯỜNG ĐI NGẮN NHẤT (DIJKSTRA SPF TRÊN R1)
  </text>

  <!-- Left: Weighted Topology Graph -->
  <g transform="translate(30, 75)" filter="url(#ospfShadow)">
    <rect width="435" height="420" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="435" height="26" rx="8" fill="#0f766e"/>
    <text x="217" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">
      1. Đồ thị mạng toàn cảnh (Bản đồ từ LSDB)
    </text>

    <!-- Links Background -->
    <!-- R1 (60, 200) to R2 (200, 80) -->
    <line x1="80" y1="200" x2="200" y2="80" stroke="#94a3b8" stroke-width="2"/>
    <rect x="120" y="125" width="45" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="142" y="139" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cost 20</text>

    <!-- R1 (80, 200) to R3 (200, 200) -->
    <line x1="80" y1="200" x2="200" y2="200" stroke="#0f766e" stroke-width="3"/>
    <rect x="120" y="190" width="40" height="20" rx="4" fill="#ffffff" stroke="#0f766e"/>
    <text x="140" y="204" fill="#0f766e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cost 5</text>

    <!-- R1 (80, 200) to R4 (200, 320) -->
    <line x1="80" y1="200" x2="200" y2="320" stroke="#94a3b8" stroke-width="2"/>
    <rect x="120" y="255" width="45" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="142" y="269" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cost 20</text>

    <!-- R2 (200, 80) to R5 (350, 200) -->
    <line x1="200" y1="80" x2="350" y2="200" stroke="#94a3b8" stroke-width="2"/>
    <rect x="260" y="125" width="45" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="282" y="139" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cost 10</text>

    <!-- R3 (200, 200) to R4 (200, 320) -->
    <line x1="200" y1="200" x2="200" y2="320" stroke="#0f766e" stroke-width="3"/>
    <rect x="180" y="250" width="45" height="20" rx="4" fill="#ffffff" stroke="#0f766e"/>
    <text x="202" y="264" fill="#0f766e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cost 10</text>

    <!-- R4 (200, 320) to R5 (350, 200) -->
    <line x1="200" y1="320" x2="350" y2="200" stroke="#0f766e" stroke-width="3"/>
    <rect x="260" y="255" width="45" height="20" rx="4" fill="#ffffff" stroke="#0f766e"/>
    <text x="282" y="269" fill="#0f766e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cost 10</text>

    <!-- Nodes Circles -->
    <!-- R1 (Root) -->
    <circle cx="80" cy="200" r="22" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
    <text x="80" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">R1</text>
    <text x="80" y="235" fill="#0284c7" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">(Root u)</text>

    <!-- R2 -->
    <circle cx="200" cy="80" r="20" fill="#334155"/>
    <text x="200" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">R2</text>
    <text x="200" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">LAN 2 (Cost 2)</text>

    <!-- R3 -->
    <circle cx="200" cy="200" r="20" fill="#0f766e"/>
    <text x="200" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">R3</text>
    <text x="200" y="174" fill="#0f766e" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">LAN 3 (Cost 2)</text>

    <!-- R4 -->
    <circle cx="200" cy="320" r="20" fill="#0f766e"/>
    <text x="200" y="325" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">R4</text>
    <text x="200" y="356" fill="#0f766e" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">LAN 4 (Cost 2)</text>

    <!-- R5 -->
    <circle cx="350" cy="200" r="20" fill="#0f766e"/>
    <text x="350" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">R5</text>
    <text x="350" y="174" fill="#0f766e" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">LAN 5 (Cost 2)</text>

    <!-- Note -->
    <text x="217" y="400" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
      Đường xanh đậm: Cây đường đi ngắn nhất (Shortest Path Tree) được R1 chọn.
    </text>
  </g>

  <!-- Right: Dijkstra SPF Calculation Table & Forwarding Result -->
  <g transform="translate(490, 75)" filter="url(#ospfShadow)">
    <rect width="440" height="420" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect width="440" height="26" rx="8" fill="#f1f5f9"/>
    <text x="220" y="18" fill="#1e293b" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">
      2. Kết quả tính toán Dijkstra &amp; Forwarding Table trên R1
    </text>

    <!-- Dijkstra Steps Mini Table -->
    <text x="14" y="46" fill="#0f766e" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">
      Bảng diễn tiến thuật toán Dijkstra từ R1 (Nút gốc):
    </text>
    
    <rect x="10" y="54" width="420" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <!-- Header -->
    <text x="35" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Bước</text>
    <text x="80" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Tập N'</text>
    <text x="160" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">D(R2),p</text>
    <text x="225" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">D(R3),p</text>
    <text x="290" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">D(R4),p</text>
    <text x="360" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">D(R5),p</text>
    <line x1="10" y1="76" x2="430" y2="76" stroke="#cbd5e1"/>

    <text x="35" y="92" fill="#334155" font-family="monospace" font-size="9">0</text>
    <text x="80" y="92" fill="#334155" font-family="monospace" font-size="9">R1</text>
    <text x="160" y="92" fill="#334155" font-family="monospace" font-size="9">20, R1</text>
    <text x="225" y="92" fill="#0f766e" font-family="monospace" font-size="9" font-weight="bold">5, R1*</text>
    <text x="290" y="92" fill="#334155" font-family="monospace" font-size="9">20, R1</text>
    <text x="360" y="92" fill="#334155" font-family="monospace" font-size="9">∞</text>

    <text x="35" y="110" fill="#334155" font-family="monospace" font-size="9">1</text>
    <text x="80" y="110" fill="#334155" font-family="monospace" font-size="9">R1, R3</text>
    <text x="160" y="110" fill="#334155" font-family="monospace" font-size="9">20, R1</text>
    <text x="225" y="110" fill="#64748b" font-family="monospace" font-size="9">—</text>
    <text x="290" y="110" fill="#0f766e" font-family="monospace" font-size="9" font-weight="bold">15, R3*</text>
    <text x="360" y="110" fill="#334155" font-family="monospace" font-size="9">∞</text>

    <text x="35" y="128" fill="#334155" font-family="monospace" font-size="9">2</text>
    <text x="80" y="128" fill="#334155" font-family="monospace" font-size="9">R1,R3,R4</text>
    <text x="160" y="128" fill="#0f766e" font-family="monospace" font-size="9" font-weight="bold">20, R1*</text>
    <text x="225" y="128" fill="#64748b" font-family="monospace" font-size="9">—</text>
    <text x="290" y="128" fill="#64748b" font-family="monospace" font-size="9">—</text>
    <text x="360" y="128" fill="#334155" font-family="monospace" font-size="9">25, R4</text>

    <text x="35" y="146" fill="#334155" font-family="monospace" font-size="9">3</text>
    <text x="80" y="146" fill="#334155" font-family="monospace" font-size="9">R1..R2</text>
    <text x="160" y="146" fill="#64748b" font-family="monospace" font-size="9">—</text>
    <text x="225" y="146" fill="#64748b" font-family="monospace" font-size="9">—</text>
    <text x="290" y="146" fill="#64748b" font-family="monospace" font-size="9">—</text>
    <text x="360" y="146" fill="#0f766e" font-family="monospace" font-size="9" font-weight="bold">25, R4*</text>

    <text x="35" y="164" fill="#334155" font-family="monospace" font-size="9">4</text>
    <text x="80" y="164" fill="#334155" font-family="monospace" font-size="9">Tất cả</text>
    <text x="220" y="164" fill="#15803d" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Hoàn tất tính toán Shortest Path Tree</text>

    <!-- Forwarding Table on R1 -->
    <text x="14" y="222" fill="#0284c7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">
      Forwarding Table (Bảng chuyển tiếp) trên R1:
    </text>

    <rect x="10" y="230" width="420" height="175" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="20" y="248" fill="#0369a1" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Mạng đích</text>
    <text x="140" y="248" fill="#0369a1" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Next Hop / Out Interface</text>
    <text x="330" y="248" fill="#0369a1" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Tổng Cost</text>
    <line x1="10" y1="254" x2="430" y2="254" stroke="#bae6fd"/>

    <text x="20" y="272" fill="#334155" font-family="monospace" font-size="9">LAN 2 (R2)</text>
    <text x="140" y="272" fill="#334155" font-family="monospace" font-size="9">via R2 (Gi0/1)</text>
    <text x="330" y="272" fill="#334155" font-family="monospace" font-size="9">22 (20 + LAN 2)</text>

    <text x="20" y="294" fill="#334155" font-family="monospace" font-size="9">LAN 3 (R3)</text>
    <text x="140" y="294" fill="#334155" font-family="monospace" font-size="9">via R3 (Gi0/2)</text>
    <text x="330" y="294" fill="#334155" font-family="monospace" font-size="9">7 (5 + LAN 2)</text>

    <text x="20" y="316" fill="#334155" font-family="monospace" font-size="9">LAN 4 (R4)</text>
    <text x="140" y="316" fill="#334155" font-family="monospace" font-size="9">via R3 (Gi0/2) [qua R3]</text>
    <text x="330" y="316" fill="#334155" font-family="monospace" font-size="9">17 (5+10 + LAN 2)</text>

    <text x="20" y="338" fill="#334155" font-family="monospace" font-size="9">LAN 5 (R5)</text>
    <text x="140" y="338" fill="#334155" font-family="monospace" font-size="9">via R3 (Gi0/2) [R3→R4→R5]</text>
    <text x="330" y="338" fill="#334155" font-family="monospace" font-size="9">27 (5+10+10 + 2)</text>

    <rect x="16" y="352" width="408" height="42" rx="4" fill="#ffffff" stroke="#0284c7"/>
    <text x="220" y="368" fill="#0369a1" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
      Đến R4: Đi qua R3 (5 + 10 = 15) tốt hơn đi trực tiếp (Cost 20)!
    </text>
    <text x="220" y="384" fill="#475569" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">
      Dijkstra luôn tìm ra đường có tổng Cost thấp nhất thay vì chỉ đếm số hop.
    </text>
  </g>
</svg>
