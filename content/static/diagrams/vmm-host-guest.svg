<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 570" role="img" aria-labelledby="title desc"><title id="title">Host VMM and guest instances</title><desc id="desc">A host provides physical resources. A virtual machine monitor maps two separate guest system instances to those resources.</desc><style>.bg{fill:#f8fafc}.h{font:700 20px sans-serif;fill:#0f172a}.k{font:700 15px sans-serif;fill:#0f172a}.t{font:13px sans-serif;fill:#334155}.host{fill:#e2e8f0;stroke:#475569;stroke-width:2;rx:12}.vmm{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.g{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:12}.line{stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#475569"/></marker></defs><rect class="bg" width="390" height="570"/><text class="h" x="195" y="32" text-anchor="middle">Host · VMM · guest</text><text class="t" x="195" y="54" text-anchor="middle">COURSE CONCEPT: state mapping boundary</text><rect class="g" x="28" y="95" width="145" height="115"/><text class="k" x="100" y="125" text-anchor="middle">Guest A</text><text class="t" x="100" y="150" text-anchor="middle">guest OS / workload</text><text class="t" x="100" y="176" text-anchor="middle">virtual resource view</text><rect class="g" x="217" y="95" width="145" height="115"/><text class="k" x="289" y="125" text-anchor="middle">Guest B</text><text class="t" x="289" y="150" text-anchor="middle">guest OS / workload</text><text class="t" x="289" y="176" text-anchor="middle">virtual resource view</text><line class="line" x1="100" y1="211" x2="150" y2="258"/><line class="line" x1="289" y1="211" x2="240" y2="258"/><rect class="vmm" x="38" y="260" width="314" height="90"/><text class="k" x="195" y="294" text-anchor="middle">Virtual Machine Monitor (VMM)</text><text class="t" x="195" y="320" text-anchor="middle">presents / coordinates virtual machine state</text><line class="line" x1="195" y1="351" x2="195" y2="398"/><rect class="host" x="38" y="400" width="314" height="94"/><text class="k" x="195" y="434" text-anchor="middle">Host physical resources</text><text class="t" x="195" y="460" text-anchor="middle">CPU · memory · storage · network</text><text class="t" x="195" y="535" text-anchor="middle">Isolation needs implementation and operational evidence.</text></svg>