<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 700" role="img" aria-labelledby="title desc">
  <title id="title">Access ports and trunk between two switches</title>
  <desc id="desc">PC-A and PC-B connect to S1 through access ports. S1 connects to S2 through one trunk carrying VLAN 10 and VLAN 20. PC-C and PC-D connect to S2 through access ports.</desc>
  <rect width="390" height="700" fill="#f7fafc"/>
  <text x="195" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#12335b">ACCESS · TRUNK · ACCESS</text>
  <rect x="14" y="48" width="362" height="330" rx="14" fill="#ffffff" stroke="#9fb6cc" stroke-width="2"/>
  <text x="28" y="75" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">TOPOLOGY LAYER 2</text>
  <text x="28" y="97" font-family="Arial,sans-serif" font-size="13" fill="#40566d">Bốn endpoint, hai access port, một trunk</text>

  <rect x="18" y="112" width="90" height="55" rx="10" fill="#e5f4ff" stroke="#2995c5" stroke-width="2"/>
  <text x="63" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#12335b">PC-A</text>
  <text x="63" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#08668f">VLAN 10</text>
  <rect x="18" y="253" width="90" height="55" rx="10" fill="#fff1df" stroke="#e38b20" stroke-width="2"/>
  <text x="63" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#12335b">PC-B</text>
  <text x="63" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#a95f00">VLAN 20</text>

  <rect x="110" y="151" width="80" height="88" rx="12" fill="#1b78a8"/>
  <text x="150" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">S1</text>
  <text x="150" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#ffffff">L2 switch</text>
  <line x1="108" y1="140" x2="110" y2="176" stroke="#496b86" stroke-width="4"/>
  <line x1="108" y1="280" x2="110" y2="214" stroke="#496b86" stroke-width="4"/>
  <text x="112" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#40566d">ACCESS</text>
  <text x="112" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#40566d">ACCESS</text>

  <rect x="210" y="151" width="80" height="88" rx="12" fill="#1b78a8"/>
  <text x="250" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">S2</text>
  <text x="250" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#ffffff">L2 switch</text>
  <line x1="190" y1="195" x2="210" y2="195" stroke="#d67800" stroke-width="6"/>
  <text x="200" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#a95f00">TRUNK</text>
  <text x="200" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#a95f00">VLAN 10, 20</text>

  <rect x="300" y="112" width="72" height="55" rx="10" fill="#e5f4ff" stroke="#2995c5" stroke-width="2"/>
  <text x="336" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#12335b">PC-C</text>
  <text x="336" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#08668f">VLAN 10</text>
  <rect x="300" y="253" width="72" height="55" rx="10" fill="#fff1df" stroke="#e38b20" stroke-width="2"/>
  <text x="336" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#12335b">PC-D</text>
  <text x="336" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a95f00">VLAN 20</text>
  <line x1="290" y1="176" x2="300" y2="140" stroke="#496b86" stroke-width="4"/>
  <line x1="290" y1="214" x2="300" y2="280" stroke="#496b86" stroke-width="4"/>
  <text x="295" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#40566d">ACCESS</text>
  <text x="295" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#40566d">ACCESS</text>
  <text x="195" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#40566d">Access port = một VLAN cho endpoint</text>

  <rect x="14" y="398" width="362" height="116" rx="14" fill="#e8f8ef" stroke="#1a9b65" stroke-width="3"/>
  <text x="30" y="428" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#087245">CASE A · PC-A → PC-C</text>
  <text x="30" y="456" font-family="Arial,sans-serif" font-size="15" fill="#12335b">VLAN 10 · qua trunk · không router</text>
  <text x="30" y="484" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#087245">Layer 2: không rewrite L3 / MAC switch-only</text>

  <rect x="14" y="536" width="362" height="116" rx="14" fill="#fff1df" stroke="#d67800" stroke-width="3"/>
  <text x="30" y="566" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#a95f00">CASE B · PC-A → PC-D</text>
  <text x="30" y="594" font-family="Arial,sans-serif" font-size="15" fill="#12335b">VLAN 10 → VLAN 20</text>
  <text x="30" y="622" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#a95f00">Trunk không route · cần Layer 3</text>
</svg>
