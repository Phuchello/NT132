<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 620" role="img" aria-labelledby="title desc">
  <title id="title">Network services path map</title>
  <desc id="desc">A client first obtains network parameters with DHCP, then a router applies policy and may translate the address with NAT before traffic reaches an external service.</desc>
  <rect width="390" height="620" fill="#f7fafc"/>
  <text x="195" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12335b">NETWORK SERVICES</text>
  <text x="195" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#40566d">Địa chỉ -&gt; chính sách -&gt; đường đi</text>

  <rect x="20" y="82" width="350" height="92" rx="14" fill="#e5f4ff" stroke="#2995c5" stroke-width="2"/>
  <circle cx="53" cy="128" r="24" fill="#0284c7"/>
  <text x="53" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">PC</text>
  <text x="92" y="113" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">1. DHCP</text>
  <text x="92" y="138" font-family="Arial,sans-serif" font-size="14" fill="#40566d">Nhận IP, mask, gateway, DNS</text>
  <text x="92" y="160" font-family="ui-monospace,monospace" font-size="12" fill="#08668f">DORA: Discover -&gt; Offer -&gt; Request -&gt; ACK</text>

  <line x1="195" y1="174" x2="195" y2="213" stroke="#64748b" stroke-width="4"/>
  <polygon points="195,225 187,210 203,210" fill="#64748b"/>

  <rect x="20" y="229" width="350" height="92" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="53" cy="275" r="24" fill="#ea580c"/>
  <text x="53" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">L3</text>
  <text x="92" y="260" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">2. ACL</text>
  <text x="92" y="284" font-family="Arial,sans-serif" font-size="14" fill="#40566d">Kiểm tra packet theo rule và hướng</text>
  <text x="92" y="306" font-family="ui-monospace,monospace" font-size="12" fill="#a95f00">first match -&gt; permit / deny</text>

  <line x1="195" y1="321" x2="195" y2="360" stroke="#64748b" stroke-width="4"/>
  <polygon points="195,372 187,357 203,357" fill="#64748b"/>

  <rect x="20" y="376" width="350" height="92" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <circle cx="53" cy="422" r="24" fill="#15803d"/>
  <text x="53" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">NAT</text>
  <text x="92" y="407" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12335b">3. NAT / PAT</text>
  <text x="92" y="431" font-family="Arial,sans-serif" font-size="14" fill="#40566d">Có thể đổi địa chỉ hoặc cổng ở biên mạng</text>
  <text x="92" y="453" font-family="ui-monospace,monospace" font-size="12" fill="#087245">inside local -&gt; inside global</text>

  <rect x="20" y="503" width="350" height="86" rx="14" fill="#12335b"/>
  <text x="195" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">CÂU HỎI THEO TRACE</text>
  <text x="195" y="556" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#dbeafe">Client nhận gì? Rule nào match?</text>
  <text x="195" y="576" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#dbeafe">Địa chỉ đổi ở điểm nào?</text>
</svg>
